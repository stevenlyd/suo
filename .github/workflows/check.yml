name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/distribution.mjs --check --base "$SUO_BASE_SHA"
        env:
          SUO_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: pnpm test:package
      - run: node test/cli-e2e.mjs
      - run: git diff --exit-code -- dist
